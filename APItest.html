<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini API Model Tester</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4e73df;
            --primary-glow: rgba(78, 115, 223, 0.3);
            --bg-dark: #0f111a;
            --card-bg: rgba(25, 28, 41, 0.7);
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --accent: #10b981;
            --error: #ef4444;
            --glass-border: rgba(255, 255, 255, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(78, 115, 223, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-dim);
            font-size: 1rem;
        }

        .api-section {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-group {
            flex: 1;
            min-width: 300px;
            position: relative;
        }

        input[type="password"], input[type="text"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            padding: 12px 16px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px var(--primary-glow);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .model-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
        }

        .model-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 16px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .model-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
        }

        .model-name {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
        }

        .model-id {
            font-size: 0.8rem;
            color: var(--text-dim);
            font-family: monospace;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 4px;
            width: fit-content;
        }

        .model-description {
            font-size: 0.9rem;
            color: var(--text-dim);
            line-height: 1.4;
            flex-grow: 1;
        }

        .test-btn {
            background: rgba(255, 255, 255, 0.1);
            width: 100%;
            justify-content: center;
        }

        .test-btn:hover {
            background: var(--accent);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .status-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-dim);
        }

        .status-badge.working { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .status-badge.failed { background: var(--error); box-shadow: 0 0 8px var(--error); }
        .status-badge.testing { background: #fbbf24; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        /* Result Modal */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .modal-content {
            background: #1a1d2e;
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            width: 100%;
            max-width: 600px;
            padding: 2.5rem;
            position: relative;
            animation: zoomIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }

        .result-body {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            border: 1px solid var(--glass-border);
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
            color: var(--text-dim);
            width: 100%;
        }

        .error-msg {
            color: var(--error);
            font-size: 0.9rem;
            margin-top: 1rem;
            text-align: center;
            width: 100%;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Gemini API Tester</h1>
            <p class="subtitle">Validate your API key and test model responsiveness</p>
        </header>

        <section class="api-section">
            <div class="input-group">
                <input type="password" id="apiKey" placeholder="Paste your Google Gemini API Key here..." autocomplete="off">
            </div>
            <button id="fetchBtn">
                <span>Fetch Models</span>
            </button>
        </section>

        <div id="controls" class="api-section" style="display: none; padding: 1rem 2rem; justify-content: center; gap: 1.5rem; margin-top: -1rem;">
            <button id="testAllBtn" class="test-btn" style="width: auto; background: var(--primary);">
                <span>Test All Models</span>
            </button>
            <div style="display: flex; align-items: center; gap: 10px;">
                <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="filterWorking" style="width: 18px; height: 18px; cursor: pointer;">
                    <span>Show Working Only</span>
                </label>
            </div>
            <button id="clearBtn" class="test-btn" style="width: auto; background: rgba(255,255,255,0.1);">
                <span>Clear Results</span>
            </button>
        </div>

        <div id="errorBox" class="error-msg"></div>

        <div id="modelGrid" class="model-grid">
            <div class="empty-state">
                Enter your API key and click "Fetch Models" to start.
            </div>
        </div>
    </div>

    <!-- Modal for Test Result -->
    <div id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle" style="font-family: 'Outfit';">Testing Model</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalStatus" style="margin-bottom: 1rem; font-weight: 500;"></div>
            <div id="modalResult" class="result-body">
                Waiting for response...
            </div>
        </div>
    </div>

    <script>
        const apiKeyInput = document.getElementById('apiKey');
        const fetchBtn = document.getElementById('fetchBtn');
        const testAllBtn = document.getElementById('testAllBtn');
        const filterWorking = document.getElementById('filterWorking');
        const clearBtn = document.getElementById('clearBtn');
        const controls = document.getElementById('controls');
        const modelGrid = document.getElementById('modelGrid');
        const errorBox = document.getElementById('errorBox');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalResult = document.getElementById('modalResult');
        const modalStatus = document.getElementById('modalStatus');

        let currentModels = [];
        let isTestingAll = false;

        // Load saved key if exists
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) apiKeyInput.value = savedKey;

        fetchBtn.addEventListener('click', async () => {
            const key = apiKeyInput.value.trim();
            if (!key) {
                showError("Please enter an API key.");
                return;
            }

            localStorage.setItem('gemini_api_key', key);
            setLoading(true);
            errorBox.style.display = 'none';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || "Failed to fetch models.");
                }

                currentModels = data.models.filter(m => m.supportedGenerationMethods.includes('generateContent'));
                renderModels(currentModels);
                controls.style.display = 'flex';
                filterWorking.checked = false;
            } catch (err) {
                showError(err.message);
                modelGrid.innerHTML = `<div class="empty-state">Failed to load models. Check your API key.</div>`;
                controls.style.display = 'none';
            } finally {
                setLoading(false);
            }
        });

        testAllBtn.addEventListener('click', async () => {
            if (isTestingAll) return;
            isTestingAll = true;
            testAllBtn.disabled = true;
            testAllBtn.innerText = 'Testing...';

            for (const model of currentModels) {
                const cleanId = model.name.replace('models/', '');
                await testModel(model.name, cleanId, true); // silent mode
            }

            testAllBtn.disabled = false;
            testAllBtn.innerText = 'Test All Models';
            isTestingAll = false;
            applyFilter();
        });

        filterWorking.addEventListener('change', applyFilter);

        clearBtn.addEventListener('click', () => {
            document.querySelectorAll('.status-badge').forEach(b => b.className = 'status-badge');
            filterWorking.checked = false;
            applyFilter();
        });

        function applyFilter() {
            const onlyWorking = filterWorking.checked;
            const cards = document.querySelectorAll('.model-card');
            cards.forEach(card => {
                const badge = card.querySelector('.status-badge');
                if (onlyWorking) {
                    card.style.display = badge.classList.contains('working') ? 'flex' : 'none';
                } else {
                    card.style.display = 'flex';
                }
            });
        }

        function renderModels(models) {
            if (!models || models.length === 0) {
                modelGrid.innerHTML = `<div class="empty-state">No models found for this API key.</div>`;
                return;
            }

            modelGrid.innerHTML = models.map(model => {
                const cleanId = model.name.replace('models/', '');
                return `
                    <div class="model-card" id="card-${cleanId}">
                        <div class="status-badge" id="status-${cleanId}"></div>
                        <div class="model-name">${model.displayName}</div>
                        <div class="model-id">${cleanId}</div>
                        <div class="model-description">${model.description || 'No description available.'}</div>
                        <button class="test-btn" onclick="testModel('${model.name}', '${cleanId}')">
                            Test Model
                        </button>
                    </div>
                `;
            }).join('');
        }

        async function testModel(modelName, cleanId, silent = false) {
            const key = apiKeyInput.value.trim();
            const badge = document.getElementById(`status-${cleanId}`);
            
            if (!silent) {
                modal.style.display = 'flex';
                modalTitle.innerText = `Testing ${cleanId}`;
                modalStatus.innerText = 'Sending "Hello" prompt...';
                modalStatus.style.color = 'var(--text-dim)';
                modalResult.innerText = 'Waiting for response...';
            }
            
            badge.className = 'status-badge testing';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Hello" }] }]
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "No text returned.";
                    if (!silent) {
                        modalStatus.innerText = 'Success! Model is working.';
                        modalStatus.style.color = 'var(--accent)';
                        modalResult.innerText = text;
                    }
                    badge.className = 'status-badge working';
                } else {
                    throw new Error(data.error?.message || "Generation failed.");
                }
            } catch (err) {
                if (!silent) {
                    modalStatus.innerText = 'Error: Model failed.';
                    modalStatus.style.color = 'var(--error)';
                    modalResult.innerText = err.message;
                }
                badge.className = 'status-badge failed';
            }
            
            if (filterWorking.checked) applyFilter();
        }

        function setLoading(isLoading) {
            fetchBtn.disabled = isLoading;
            fetchBtn.innerHTML = isLoading ? 
                `<div class="loader"></div><span>Fetching...</span>` : 
                `<span>Fetch Models</span>`;
        }

        function showError(msg) {
            errorBox.innerText = msg;
            errorBox.style.display = 'block';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target == modal) closeModal();
        }
    </script>
</body>
</html>
